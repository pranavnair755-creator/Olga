<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 162" width="200" height="162">
  <defs>
    <!-- Metallic Chrome Bezel Ring -->
    <linearGradient id="chromeBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#93c5fd"/>
      <stop offset="45%" stop-color="#1e3a8a"/>
      <stop offset="70%" stop-color="#60a5fa"/>
      <stop offset="88%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Deep Millionaire Studio Blue Core -->
    <radialGradient id="studioBlueCore" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="40%" stop-color="#0c2363"/>
      <stop offset="75%" stop-color="#05102d"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Radiant Cyan-White Core Glow -->
    <radialGradient id="bulbGlow" cx="50%" cy="46%" r="45%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#a5f3fc"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="strongGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Metallic Medallion Ring -->
  <ellipse cx="100" cy="81" rx="88" ry="70" fill="url(#chromeBezel)" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Bevel Shadow Ring -->
  <ellipse cx="100" cy="81" rx="83" ry="65" fill="#020617"/>
  <!-- Inner Lens Surface -->
  <ellipse cx="100" cy="81" rx="80" ry="62" fill="url(#studioBlueCore)"/>

  <!-- Subtle Studio Radar Web Lines -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.3">
    <ellipse cx="100" cy="81" rx="55" ry="42" fill="none" stroke-dasharray="3,3"/>
    <ellipse cx="100" cy="81" rx="32" ry="24" fill="none"/>
    <line x1="100" y1="20" x2="100" y2="142"/>
    <line x1="22" y1="81" x2="178" y2="81"/>
  </g>

  <!-- Central Lightbulb & Wisdom Spark Graphic -->
  <g transform="translate(100, 78)">
    <!-- Bulb Aura Glow -->
    <circle cx="0" cy="-6" r="28" fill="url(#bulbGlow)" opacity="0.65" filter="url(#strongGlow)"/>

    <!-- Radiant Rays -->
    <g stroke="#a5f3fc" stroke-width="2" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="-38" x2="0" y2="-46"/>
      <line x1="24" y1="-30" x2="31" y2="-37"/>
      <line x1="-24" y1="-30" x2="-31" y2="-37"/>
      <line x1="32" y1="-8" x2="41" y2="-8"/>
      <line x1="-32" y1="-8" x2="-41" y2="-8"/>
    </g>

    <!-- Glass Bulb Contour -->
    <path d="M -18 -8 C -18 -20, 18 -20, 18 -8 C 18 -1, 10 7, 9 14 L -9 14 C -10 7, -18 -1, -18 -8 Z" 
          fill="rgba(14, 165, 233, 0.25)" 
          stroke="#ffffff" 
          stroke-width="2.2" 
          filter="url(#softGlow)"/>

    <!-- Metallic Screw Base -->
    <path d="M -7 14 L 7 14 L 6 18 L -6 18 Z" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M -5 18 L 5 18 L 4 21 L -4 21 Z" fill="#64748b" stroke="#cbd5e1" stroke-width="1"/>
    <ellipse cx="0" cy="22" rx="3" ry="1.5" fill="#334155"/>

    <!-- Radiant 4-Point Star Filament (Insight Spark) -->
    <path d="M 0 -19 Q 0 -8 11 -8 Q 0 -8 0 3 Q 0 -8 -11 -8 Q 0 -8 0 -19 Z" 
          fill="#ffffff" 
          filter="url(#softGlow)"/>
    <circle cx="0" cy="-8" r="3" fill="#e0f2fe"/>
  </g>

  <!-- Top Curved Label: HINT -->
  <text x="100" y="36" 
        text-anchor="middle" 
        font-family="'Copperplate Gothic', 'Copperplate', 'Cinzel', 'Trajan Pro', serif" 
        font-weight="900" 
        font-size="16" 
        fill="#ffffff" 
        letter-spacing="4" 
        filter="drop-shadow(0 2px 4px rgba(0,0,0,0.95))">HINT</text>

  <!-- Bottom Curved Label: HELP -->
  <text x="100" y="138" 
        text-anchor="middle" 
        font-family="'Copperplate Gothic', 'Copperplate', 'Cinzel', 'Trajan Pro', serif" 
        font-weight="900" 
        font-size="16" 
        fill="#38bdf8" 
        letter-spacing="4" 
        filter="drop-shadow(0 2px 4px rgba(0,0,0,0.95))">HELP</text>

  <!-- Glass Lens Highlight Arc -->
  <path d="M 38 45 A 72 54 0 0 1 162 45" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
