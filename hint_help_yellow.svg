<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 162" width="200" height="162">
  <defs>
    <!-- Glowing Golden Yellow Chrome Rim -->
    <linearGradient id="goldBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#b45309"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="88%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Warm Amber Radiant Core -->
    <radialGradient id="studioGoldCore" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="75%" stop-color="#2d1303"/>
      <stop offset="100%" stop-color="#140600"/>
    </radialGradient>

    <!-- Radiant Golden Core Glow -->
    <radialGradient id="goldBulbGlow" cx="50%" cy="46%" r="45%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <filter id="goldGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Golden Outer Aura -->
  <ellipse cx="100" cy="81" rx="92" ry="74" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.6" filter="url(#goldGlow)"/>

  <!-- Outer Metallic Gold Ring -->
  <ellipse cx="100" cy="81" rx="88" ry="70" fill="url(#goldBezel)" stroke="#fef08a" stroke-width="3"/>
  <!-- Shadow Ring -->
  <ellipse cx="100" cy="81" rx="83" ry="65" fill="#1c0a00"/>
  <!-- Inner Lens Surface -->
  <ellipse cx="100" cy="81" rx="80" ry="62" fill="url(#studioGoldCore)"/>

  <!-- Subtle Studio Radar Web Lines -->
  <g stroke="#fde047" stroke-width="1.2" opacity="0.45">
    <ellipse cx="100" cy="81" rx="55" ry="42" fill="none" stroke-dasharray="3,3"/>
    <ellipse cx="100" cy="81" rx="32" ry="24" fill="none"/>
    <line x1="100" y1="20" x2="100" y2="142"/>
    <line x1="22" y1="81" x2="178" y2="81"/>
  </g>

  <!-- Central Glowing Lightbulb & Wisdom Spark Graphic -->
  <g transform="translate(100, 78)">
    <!-- Bulb Aura Glow -->
    <circle cx="0" cy="-6" r="30" fill="url(#goldBulbGlow)" opacity="0.8" filter="url(#goldGlow)"/>

    <!-- Radiant Rays -->
    <g stroke="#fef08a" stroke-width="2.2" stroke-linecap="round" opacity="0.95">
      <line x1="0" y1="-38" x2="0" y2="-46"/>
      <line x1="24" y1="-30" x2="31" y2="-37"/>
      <line x1="-24" y1="-30" x2="-31" y2="-37"/>
      <line x1="32" y1="-8" x2="41" y2="-8"/>
      <line x1="-32" y1="-8" x2="-41" y2="-8"/>
    </g>

    <!-- Glass Bulb Contour -->
    <path d="M -18 -8 C -18 -20, 18 -20, 18 -8 C 18 -1, 10 7, 9 14 L -9 14 C -10 7, -18 -1, -18 -8 Z" 
          fill="rgba(245, 158, 11, 0.35)" 
          stroke="#ffffff" 
          stroke-width="2.4" 
          filter="url(#goldGlow)"/>

    <!-- Metallic Screw Base -->
    <path d="M -7 14 L 7 14 L 6 18 L -6 18 Z" fill="#d97706" stroke="#fef08a" stroke-width="1"/>
    <path d="M -5 18 L 5 18 L 4 21 L -4 21 Z" fill="#92400e" stroke="#fde047" stroke-width="1"/>
    <ellipse cx="0" cy="22" rx="3" ry="1.5" fill="#451a03"/>

    <!-- Radiant 4-Point Star Filament (Insight Spark) -->
    <path d="M 0 -19 Q 0 -8 11 -8 Q 0 -8 0 3 Q 0 -8 -11 -8 Q 0 -8 0 -19 Z" 
          fill="#ffffff" 
          filter="url(#goldGlow)"/>
    <circle cx="0" cy="-8" r="3" fill="#fffbeb"/>
  </g>

  <!-- Top Curved Label: HINT -->
  <text x="100" y="36" 
        text-anchor="middle" 
        font-family="'Copperplate Gothic', 'Copperplate', 'Cinzel', 'Trajan Pro', serif" 
        font-weight="900" 
        font-size="16" 
        fill="#ffffff" 
        letter-spacing="4" 
        filter="drop-shadow(0 2px 4px rgba(0,0,0,0.95))">HINT</text>

  <!-- Bottom Curved Label: HELP -->
  <text x="100" y="138" 
        text-anchor="middle" 
        font-family="'Copperplate Gothic', 'Copperplate', 'Cinzel', 'Trajan Pro', serif" 
        font-weight="900" 
        font-size="16" 
        fill="#fef08a" 
        letter-spacing="4" 
        filter="drop-shadow(0 2px 4px rgba(0,0,0,0.95))">HELP</text>

  <!-- Glass Lens Highlight Arc -->
  <path d="M 38 45 A 72 54 0 0 1 162 45" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.8" stroke-linecap="round"/>
</svg>
