<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 162" width="200" height="162">
  <defs>
    <!-- Glowing Golden Yellow Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    
    <!-- Warm Radiant Amber Center -->
    <radialGradient id="bgGoldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0a00"/>
    </radialGradient>

    <!-- Warm Spark Glow -->
    <radialGradient id="goldSparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <filter id="goldGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Yellow Outer Flare -->
  <ellipse cx="100" cy="81" rx="92" ry="74" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.6" filter="url(#goldGlowFilter)"/>

  <!-- Outer Ring / Medallion Body -->
  <ellipse cx="100" cy="81" rx="88" ry="70" fill="url(#goldRim)" stroke="#fef08a" stroke-width="3"/>
  <ellipse cx="100" cy="81" rx="83" ry="65" fill="#1c0a00"/>
  <ellipse cx="100" cy="81" rx="80" ry="62" fill="url(#bgGoldGlow)"/>

  <!-- Radial Starburst Lines -->
  <g stroke="#fde047" stroke-width="1.5" opacity="0.55">
    <line x1="100" y1="21" x2="100" y2="141"/>
    <line x1="22" y1="81" x2="178" y2="81"/>
    <line x1="45" y1="38" x2="155" y2="124"/>
    <line x1="45" y1="124" x2="155" y2="38"/>
  </g>

  <!-- Central Gold AI Spark / Diamond -->
  <g transform="translate(100, 66) scale(0.95)" filter="url(#goldGlowFilter)">
    <circle cx="0" cy="0" r="28" fill="url(#goldSparkGlow)" opacity="0.8"/>
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="#ffffff"/>
    <path d="M 0 -13 Q 0 0 13 0 Q 0 0 0 13 Q 0 0 -13 0 Q 0 0 0 -13 Z" fill="#fbbf24" transform="rotate(45)"/>
    <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Top Badge Label -->
  <text x="100" y="42" text-anchor="middle" font-family="'Copperplate', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="3" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.9))">HINT</text>

  <!-- Bottom Badge Label -->
  <text x="100" y="128" text-anchor="middle" font-family="'Copperplate', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="14" fill="#fef08a" letter-spacing="3" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.9))">HELP</text>
  
  <ellipse cx="100" cy="81" rx="80" ry="62" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="1.5"/>
</svg>
